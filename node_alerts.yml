# Prometheus Alert Rules
# Location on server: /opt/prometheus/alerts/node_alerts.yml

groups:
  - name: node_exporter_alerts
    rules:

      # Fires when CPU usage exceeds 80% for more than 1 continuous minute
      # for: 1m prevents false alarms from brief spikes
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% for more than 1 minute on {{ $labels.instance }}"

      # Fires when available memory drops below 20% of total
      - alert: LowMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 20
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Low memory on {{ $labels.instance }}"
          description: "Available memory is below 20% on {{ $labels.instance }}"

      # Fires when disk usage exceeds 85%
      - alert: HighDiskUsage
        expr: 100 - ((node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100) > 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High disk usage on {{ $labels.instance }}"
          description: "Disk usage on / is above 85% on {{ $labels.instance }}"
